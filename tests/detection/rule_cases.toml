# Test cases for every rule in src/loginsight/detection/rules/default.toml.
#
# One table per rule id, with two lists of request targets (path plus query):
#   match     requests the rule MUST catch (at least 2),
#   no_match  requests that share the rule's words but are NOT attacks, so the rule must
#             leave them alone (at least 3).
#
# tests/detection/test_rule_cases.py fails if a rule has too few cases, if a case is not
# handled the way it says, or if a table names a rule that no longer exists. Write attack
# examples from the technique (cheat sheets), not copied from scripts/generate_logs.py.

[sqli-union-select]
match = [
  "/item?id=-1 UNION ALL SELECT NULL,NULL,version()--",
  "/item?id=1/**/UNION/**/SELECT/**/1,2",
  "/item?id=1 uNiOn aLl sElEcT 1,@@version",
  "/item?id=0'+union+select+user,pass+from+admin--+",
  "/item?id=1/**/UNION/**/ALL/**/SELECT/**/1",
]
no_match = [
  "/s?q=union+of+committee",
  "/s?q=onion+select",
  "/s?q=union.select",
]

[sqli-tautology]
match = [
  "/login?user=' or '1'='1",
  "/login?user=admin' or 1=1#",
  "/login?user=') or ('a'='a",
  "/login?user=\" or \"\"=\"",
  "/login?user='or'1'='1",
  "/item?id=5 or 1=1",
  "/item?id=5 AND 7=7",
  "/login?u=x' and 1=2 union select 1",
  "/item?id=1' OR 'x' LIKE 'x",
  "/item?id=1'||'a'='a",
  "/item?id=1' or/**/1=1",
  "/item?id=5/**/or/**/7=7",
  "/item?id=1'/**/and/**/'a'='a",
  "/item?id=1 having 1=1",
]
no_match = [
  "/s?q=o'brien",
  "/s?q=rock'n'roll",
  "/s?q=1+or+2",
  "/api?filter={\"or\":[1]}",
]

[sqli-quote-comment]
match = [
  "/login?user=admin'-- -",
  "/login?user=admin'#",
  "/login?user=admin')/*",
  "/login?user=admin\" --",
]
no_match = [
  "/s?q=it's+fine",
  "/s?q=5+--+3",
  "/s?q=a%23b",
]

