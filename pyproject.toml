[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loginsight"
version = "0.0.1"
description = "Web server access-log analyzer with rule-based attack detection."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Priscilla Kanodi" }]
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' --import-mode=importlib"
markers = [
    "slow: long-running checks, run with `pytest -m slow`",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
